name: Déploiement de la base

# Applique les migrations au projet Supabase de production :
#  * automatiquement quand une migration arrive sur main (fusion d'une PR) ;
#  * à la demande (onglet Actions > Déploiement de la base > Run workflow).
# Les tests sont rejoués d'abord ; rien n'est envoyé s'ils échouent.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#  * SUPABASE_ACCESS_TOKEN : jeton personnel Supabase (Account > Access Tokens)
#  * SUPABASE_DB_PASSWORD : mot de passe de la base du projet
#  * R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY (facultatifs) : clés du compartiment privé
#    Cloudflare R2 des photos, passées à la fonction photos-r2 ; absentes, les photos restent sur
#    Supabase Storage. Variable R2_BUCKET (facultative, défaut suivi-fuites-photos). Mêmes secrets pour version-apk
#    (mise à jour de l'APK publiée dans R2 par le workflow apk.yml).
#  * FIREBASE_SERVICE_ACCOUNT (facultatif) : fichier JSON du compte de service Firebase (Paramètres du projet >
#    Comptes de service > Générer une clé privée), passé à la fonction envoyer-push ; absent, aucune notification
#    push ne part (la cloche de l'appli reste à jour).
#  * DOLIBARR_API_URL, DOLIBARR_API_CLE, CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET (facultatifs, les quatre ensemble) :
#    lecture des mouvements de stock dans l'API REST de Dolibarr (X8) derrière Cloudflare Access (outils/dolibarr/README.md),
#    passés à la fonction dolibarr-mouvements ; absents, elle répond « non configuré » (import CSV en secours).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

concurrency:
  group: deploiement-base
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_ID: osajiinsibwrsltntmsk

jobs:
  tests:
    name: Tests avant déploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer PostgreSQL 16, PostGIS et pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - name: Appliquer les migrations et lancer les tests
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/ci/lancer-tests.sh

  deployer:
    name: Appliquer au projet Supabase
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secrets SUPABASE_ACCESS_TOKEN et SUPABASE_DB_PASSWORD manquants dans GitHub (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Migrations à appliquer (simulation)
        run: supabase db push --dry-run
      - name: Appliquer les migrations
        run: supabase db push
      - name: État des migrations sur le projet
        run: supabase migration list

  fonctions:
    name: Déployer les fonctions serveur
    needs: deployer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer gerer-utilisateurs
        run: supabase functions deploy gerer-utilisateurs --project-ref "$SUPABASE_PROJECT_ID"
      - name: Secrets R2 de photos-r2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "Secrets R2 absents : photos-r2 répondra « non configuré » (photos sur Supabase Storage)."
            exit 0
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            R2_ACCOUNT_ID="$R2_ACCOUNT_ID" R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" \
            R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" R2_BUCKET="${R2_BUCKET:-suivi-fuites-photos}"
      - name: Déployer photos-r2
        run: supabase functions deploy photos-r2 --project-ref "$SUPABASE_PROJECT_ID"
      - name: Déployer version-apk
        run: supabase functions deploy version-apk --project-ref "$SUPABASE_PROJECT_ID"
      - name: Secret Firebase de envoyer-push
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Secret FIREBASE_SERVICE_ACCOUNT absent : envoyer-push répondra « non configuré » (pas de push)."
            exit 0
          fi
          # JSON sur une ligne (le fichier téléchargé de Firebase en compte plusieurs).
          COMPTE=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account' and d.get('private_key'), 'compte de service invalide'; print(json.dumps(d, separators=(',', ':')))")
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" FIREBASE_SERVICE_ACCOUNT="$COMPTE"
      - name: Déployer envoyer-push
        run: supabase functions deploy envoyer-push --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
      - name: Déployer reseau-tuiles
        # Mêmes secrets R2 que photos-r2 (secrets du projet) : tuiles vectorielles du réseau, URL signées.
        run: supabase functions deploy reseau-tuiles --project-ref "$SUPABASE_PROJECT_ID"
      - name: Secrets de dolibarr-mouvements
        env:
          DOLIBARR_API_URL: ${{ secrets.DOLIBARR_API_URL }}
          DOLIBARR_API_CLE: ${{ secrets.DOLIBARR_API_CLE }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DOLIBARR_API_URL" ] || [ -z "$DOLIBARR_API_CLE" ] || [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "Secrets de l'API Dolibarr absents : dolibarr-mouvements répondra « non configuré » (import CSV en secours)."
            exit 0
          fi
          if ! printf '%s' "$DOLIBARR_API_URL" | grep -Eq '^https://[^/[:space:]]+/[^[:space:]]*api/index\.php/?$'; then
            echo "::error::DOLIBARR_API_URL doit être l'adresse https de l'API (…/api/index.php)."
            exit 1
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            DOLIBARR_API_URL="$DOLIBARR_API_URL" DOLIBARR_API_CLE="$DOLIBARR_API_CLE" \
            CF_ACCESS_CLIENT_ID="$CF_ACCESS_CLIENT_ID" CF_ACCESS_CLIENT_SECRET="$CF_ACCESS_CLIENT_SECRET"
      - name: Déployer dolibarr-mouvements
        # Sans JWT imposé : la fonction vérifie elle-même la clé d'appel de la base (lecture planifiée) ou le jeton du
        # compte (bouton « Synchroniser maintenant »).
        run: supabase functions deploy dolibarr-mouvements --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
