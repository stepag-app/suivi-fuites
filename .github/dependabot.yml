# Mises à jour de dépendances surveillées par Dependabot (constat H11 de l'audit S20).
# Rythme mensuel et PR groupées : on limite le bruit pour un dépôt tenu par une seule personne.
# Les alertes de sécurité (vulnérabilités connues) sont, elles, activées côté réglages du dépôt.
version: 2
updates:
  # Actions GitHub épinglées dans .github/workflows/ (actions/checkout, setup-node, etc.).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions-github:
        patterns: ['*']

  # Panneau web (Next.js) : web/package.json + package-lock.json.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      web-mineures-et-correctifs:
        update-types: [minor, patch]

  # Application tablette (Expo / React Native) : mobile/package.json + package-lock.json.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      mobile-mineures-et-correctifs:
        update-types: [minor, patch]
