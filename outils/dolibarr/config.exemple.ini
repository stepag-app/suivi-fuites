; Configuration de l'envoi automatique des mouvements Dolibarr (outils/dolibarr/envoi-mouvements.php).
; Copier ce fichier en config.ini, dans le même dossier, sur le serveur Dolibarr seulement.
; config.ini contient le jeton : il ne doit jamais être copié ailleurs (ni dépôt, ni e-mail, ni discussion).

; Adresse de la fonction Supabase du projet suivi-fuites (rien à changer).
url_fonction = https://osajiinsibwrsltntmsk.supabase.co/functions/v1/dolibarr-mouvements

; Jeton dédié : le même que le secret GitHub DOLIBARR_JETON. Laisser vide puis lancer
;   C:\xampp\php\php.exe envoi-mouvements.php --creer-jeton
; pour en écrire un ici automatiquement.
jeton =

; Fichier de configuration de Dolibarr (identifiants de la base lus à chaque passage, jamais recopiés).
conf_dolibarr = C:/xampp/htdocs/erp/conf/conf.php

; Les mouvements des N derniers jours sont toujours renvoyés (sécurité ; un renvoi ne double rien).
jours_recouvrement = 3

; Nombre de mouvements par envoi (50 à 5000).
taille_lot = 1000

; Fichier des autorités de certification pour HTTPS. Vide : celui de XAMPP
; (C:/xampp/apache/bin/curl-ca-bundle.crt) s'il existe, sinon celui de php.ini.
certificats =
