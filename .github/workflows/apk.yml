name: Application Android (APK)

# Depuis le 2026-10-11 (décision d'Issam) : plus de nouvelle version publiée aux tablettes à chaque fusion.
#  * Pull request qui touche mobile/ : types (tsc) et essais sans pile, toujours ; compilation Gradle (APK en artefact,
#    14 jours) seulement si un fichier natif change (app.json, app.config.js, plugins/, modules/, package.json,
#    package-lock.json) ou ce workflow lui-même. Jamais de publication depuis une PR.
#  * Push sur main : types et essais seulement (ni compilation ni publication).
#  * Publication pour les tablettes : à la main, Actions > Application Android (APK) > Run workflow, branche main,
#    avec le nom de version (ex. 1.0.0) : APK signée avec la clé de production, déposée dans le compartiment privé R2
#    (fenêtre « Mise à jour disponible » sur les tablettes). Le numéro de version (versionCode) reste le numéro du run,
#    toujours croissant : une APK plus récente s'installe par-dessus la précédente.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'outils/tablettes/**'
      - '.github/workflows/apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'outils/tablettes/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: "Nom de la version (ex. 1.0.0-beta.1, 1.0.0) : versionName de l'APK, affiché aux tablettes sans libellé"
        required: true
        type: string
      libelle:
        description: "Libellé affiché aux tablettes dans « Nouvelle version … disponible » (ex. 1.0 bêta) ; vide : le nom de version"
        required: false
        type: string
      publier:
        description: "Publier pour les tablettes (R2, depuis main seulement). Décocher pour une simple compilation d'essai (artefact)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verifications:
    name: Types et essais sans pile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    outputs:
      compiler: ${{ steps.natif.outputs.compiler }}
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Sur une PR, le commit vérifié est la fusion d'essai : son premier parent est la base, la différence = la PR.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Vrai code de la file d'attente et de la session, vrai client Supabase ; serveur et réseau simulés.
      - name: Essais sans pile (file d'attente, session hors ligne, suivi GPS, mesures de nuit, listes des tablettes)
        run: |
          node --import ./essais/substituts.mjs essais/file-attente-hors-pile.test.mjs
          node --import ./essais/substituts.mjs essais/mesures-nuit.test.mjs
          node --import ./essais/substituts.mjs essais/session-hors-ligne.test.mjs
          node --import ./essais/substituts.mjs essais/regles-saisie.test.mjs
          node --import ./essais/substituts.mjs essais/suivi-gps.test.mjs
          node essais/tablette-listes.test.mjs
      - name: Faut-il compiler l'APK ?
        id: natif
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Déclenchement manuel : compilation."
            echo "compiler=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "Push sur main : types et essais seulement, ni compilation ni publication."
            echo "compiler=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! fichiers="$(git diff --name-only HEAD^1 HEAD)"; then
            echo "::warning::Fichiers modifiés par la PR indéterminés : compilation par prudence."
            echo "compiler=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(mobile/(app\.json|app\.config\.js|package\.json|package-lock\.json|plugins/|modules/)|\.github/workflows/apk\.yml)'; then
            echo "Fichier natif (ou ce workflow) modifié par la PR : compilation de l'APK."
            echo "compiler=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun fichier natif modifié par la PR : pas de compilation (types et essais suffisent)."
            echo "compiler=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Compilation de l'APK
    needs: verifications
    if: needs.verifications.outputs.compiler == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: '1'
      # Adresse et clé « anon » : publiques par conception (jamais la clé service_role).
      EXPO_PUBLIC_SUPABASE_URL: https://osajiinsibwrsltntmsk.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'cle-factice-pour-la-compilation' }}
      # Numéro de version (app.config.js) : numéro du run, toujours croissant ; c'est lui que l'appli compare à la
      # version publiée. Nom de version : celui saisi au déclenchement manuel ; 1.0.<run> pour une compilation d'essai.
      APK_VERSION_CODE: ${{ github.run_number }}
      APK_VERSION_NAME: ${{ inputs.version || format('1.0.{0}', github.run_number) }}
      # Libellé lu par les tablettes (derniere.json : version) ; le nom de version reste dans l'APK et dans version_name.
      APK_LIBELLE: ${{ inputs.libelle }}
    steps:
      - uses: actions/checkout@v4
      - name: Contrôler le nom de la version
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ! printf '%s' "$APK_VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Nom de version invalide : « $APK_VERSION_NAME » (attendu : 1.0.0, 0.9.1, 1.0.0-rc.1…)."
            exit 1
          fi
          echo "Version $APK_VERSION_NAME, numéro $APK_VERSION_CODE."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      # Notifications push : fichier Firebase de l'appli Android (secret GOOGLE_SERVICES_JSON, contenu JSON brut),
      # jamais dans le dépôt. Absent : APK sans push (aucun jeton enregistré), tout le reste fonctionne.
      - name: Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Secret GOOGLE_SERVICES_JSON absent : APK compilée sans notifications push."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          python3 - <<'PY2'
          import json
          d = json.load(open('google-services.json'))
          paquets = [c['client_info']['android_client_info']['package_name'] for c in d.get('client', [])]
          assert 'ma.stepag.suivifuites' in paquets, f'google-services.json ne contient pas ma.stepag.suivifuites : {paquets}'
          PY2
      - run: npx expo prebuild --platform android --no-install
      - name: Signature de production (si le keystore est disponible)
        id: signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ]; then
            echo "mode=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/suivi-fuites.keystore"
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          bloc = """        release {
              storeFile file(System.getenv('KS_FILE'))
              storePassword System.getenv('KS_PASS')
              keyAlias System.getenv('KS_ALIAS')
              keyPassword System.getenv('KS_PASS')
              storeType 'PKCS12'
          }
          """
          s, n = re.subn(r'(signingConfigs \{[^\n]*\n)', lambda m: m.group(1) + bloc, s, count=1)
          assert n == 1, 'signingConfigs introuvable'
          m = re.search(r'buildTypes \{.*?release \{(.*?)\n        \}', s, re.S)
          assert m, 'buildTypes.release introuvable'
          corps = re.sub(r'signingConfig signingConfigs\.\w+', 'signingConfig signingConfigs.release', m.group(1))
          assert 'signingConfigs.release' in corps, 'signingConfig absent du build release'
          s = s[:m.start(1)] + corps + s[m.end(1):]
          open(p, 'w').write(s)
          PY
          echo "KS_FILE=$RUNNER_TEMP/suivi-fuites.keystore" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "mode=production" >> "$GITHUB_OUTPUT"
      - name: Compilation (release)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Vérifier la signature
        if: steps.signature.outputs.mode == 'production'
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | tee certs.txt
          grep -q "CN=STEPAG APP" certs.txt || { echo "APK non signé avec la clé de production"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: suivi-fuites-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
      # Mise à jour des tablettes (X2) : seulement au déclenchement manuel depuis main, case « publier » cochée, APK signée
      # avec la clé de production. Dépôt dans le compartiment privé R2 (apk/suivi-fuites-<numéro>.apk + apk/derniere.json) ;
      # la fonction serveur version-apk la propose aux tablettes par une URL signée. Les 3 dernières APK sont gardées.
      - name: Publier la version (R2)
        if: github.event_name == 'workflow_dispatch' && inputs.publier && github.ref == 'refs/heads/main' && steps.signature.outputs.mode == 'production'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'suivi-fuites-photos' }}
          AWS_DEFAULT_REGION: auto
          # R2 refuse les sommes de contrôle ajoutées d'office par les versions récentes de l'AWS CLI.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Secrets R2 absents : version non publiée (les tablettes ne la verront pas)."
            exit 1
          fi
          E="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          CHEMIN="apk/suivi-fuites-$APK_VERSION_CODE.apk"
          aws s3 cp "$APK" "s3://$R2_BUCKET/$CHEMIN" --endpoint-url "$E" --content-type application/vnd.android.package-archive --no-progress
          python3 - "$APK" "$CHEMIN" > derniere.json <<'PY2'
          import datetime, hashlib, json, os, sys
          apk, chemin = sys.argv[1], sys.argv[2]
          nom = os.environ['APK_VERSION_NAME']
          libelle = ' '.join(os.environ.get('APK_LIBELLE', '').split())[:40] or nom
          print(json.dumps({
            'version_code': int(os.environ['APK_VERSION_CODE']), 'version': libelle, 'version_name': nom, 'chemin': chemin,
            'taille': os.path.getsize(apk), 'sha256': hashlib.sha256(open(apk, 'rb').read()).hexdigest(),
            'commit': os.environ['GITHUB_SHA'], 'publiee_le': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, ensure_ascii=False))
          PY2
          cat derniere.json
          aws s3 cp derniere.json "s3://$R2_BUCKET/apk/derniere.json" --endpoint-url "$E" --content-type application/json --cache-control no-store
          aws s3 ls "s3://$R2_BUCKET/apk/" --endpoint-url "$E" | awk '{print $4}' | grep -E '^suivi-fuites-[0-9]+\.apk$' \
            | sort -t- -k3 -n | head -n -3 | while read -r ancien; do
              aws s3 rm "s3://$R2_BUCKET/apk/$ancien" --endpoint-url "$E" || true
            done || true
          echo "## APK publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "Version **$APK_VERSION_NAME** (numéro $APK_VERSION_CODE, libellé « $(python3 -c "import json; print(json.load(open('derniere.json'))['version'])") »), commit \`$GITHUB_SHA\`, déposée dans R2 : les tablettes la proposent à la prochaine ouverture." >> "$GITHUB_STEP_SUMMARY"
      - name: Publication non faite
        if: github.event_name == 'workflow_dispatch' && inputs.publier && (github.ref != 'refs/heads/main' || steps.signature.outputs.mode != 'production')
        run: |
          echo "::warning::APK compilée mais non publiée : la publication exige la branche main et la clé de production (secrets ANDROID_KEYSTORE_*). Artefact disponible : suivi-fuites-apk."
