name: Test de restauration

# Vérifie qu'une sauvegarde se restaure vraiment : téléchargement de l'archive chiffrée, déchiffrement,
# restauration dans une base Supabase locale et vierge créée dans la CI, puis contrôle des tables, des
# nombres de lignes, du déclencheur de création de profil et des règles de storage.objects. Aucun
# contournement : toute table non restaurable, tout écart de lignes, tout objet manquant fait échouer le test.
#
# Déclencheurs :
#  * chaque lundi à 04:07 UTC (après la sauvegarde de 02:17) : dernière sauvegarde réussie de main ;
#  * à la demande (Actions > Test de restauration > Run workflow) : idem, ou l'exécution de
#    « Sauvegarde de la base » dont on donne le numéro ;
#  * sur une PR qui modifie les workflows de sauvegarde ou outils/sauvegarde/ : une sauvegarde COMPLÈTE est
#    d'abord réalisée (copie R2 comprise, c'est une vraie sauvegarde), puis restaurée.
#
# Sécurité :
#  * aucune connexion de ce job au projet Supabase de production : pas de « supabase link », ni
#    SUPABASE_ACCESS_TOKEN ni SUPABASE_DB_PASSWORD ; seuls l'artefact de sauvegarde et la copie R2 sont lus ;
#  * secrets utilisés : SAUVEGARDE_PASSPHRASE (transmise à gpg par l'entrée standard, jamais en argument) et
#    les clés R2 (lecture de la copie pour comparer son empreinte) ;
#  * aucune donnée affichée : journaux et résumé ne montrent que des noms de tables, des nombres de
#    lignes et des messages d'erreur dont les valeurs sont masquées ; les fichiers déchiffrés ne sont
#    jamais republiés et sont effacés en fin de job, même en cas d'échec.
#
# Méthode : pile Supabase locale (« supabase start ») dans un dossier temporaire sans migrations.
# Même image PostgreSQL 17 que la production, schémas auth et storage créés par les vrais services
# GoTrue et Storage, rôles anon / authenticated / service_role, PostGIS ; les autres services sont
# exclus. La restauration est faite par outils/sauvegarde/restaurer.sh, le MÊME script que celui de la
# procédure manuelle (supabase/README.md) : schema.sql, donnees.sql, puis complement.sql, une transaction
# par fichier, ON_ERROR_STOP=1.

on:
  schedule:
    - cron: '7 4 * * 1'
  workflow_dispatch:
    inputs:
      sauvegarde_run_id:
        description: "Numéro d'une exécution de « Sauvegarde de la base » à restaurer (vide : la dernière réussie sur main)"
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/test-restauration.yml'
      - '.github/workflows/sauvegarde-base.yml'
      - 'outils/sauvegarde/**'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  sauvegarde:
    name: Sauvegarde préalable (PR seulement)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/sauvegarde-base.yml
    secrets: inherit

  restauration:
    name: Restaurer et contrôler la sauvegarde
    needs: sauvegarde
    if: ${{ !cancelled() && (needs.sauvegarde.result == 'success' || needs.sauvegarde.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les outils
        run: |
          cat > "$RUNNER_TEMP/outils.sh" <<'OUTILS'
          # Fonctions communes. Elles n'affichent jamais de données : seulement des noms de tables,
          # des nombres de lignes et des erreurs dont les valeurs sont masquées.
          R="$RUNNER_TEMP/restauration"   # dossier de travail, effacé en fin de job
          F="$R/fichiers"                 # fichiers SQL déchiffrés

          # psql de l'image Supabase, exécuté dans le conteneur de la base locale.
          commande_psql() {
            echo "docker exec -i $BASE_CONTENEUR psql -h 127.0.0.1 -p 5432 -U postgres -d postgres"
          }
          psql_pile() {
            docker exec -i "$BASE_CONTENEUR" \
              psql -h 127.0.0.1 -p 5432 -U postgres -d postgres -X -q \
                   -v ON_ERROR_STOP=1 -v VERBOSITY=terse -v SHOW_CONTEXT=never "$@"
          }

          # « schéma<TAB>table<TAB>lignes » pour chaque bloc COPY d'un fichier de données.
          blocs_copy() {
            awk '
              dans { if ($0 == "\\.") { print s "\t" t "\t" n; dans = 0 } else n++; next }
              /^COPY "[^"]+"\."[^"]+" .*FROM stdin;$/ { split($0, p, "\""); s = p[2]; t = p[4]; n = 0; dans = 1 }
            ' "$1"
          }

          # Compare chaque bloc COPY (TSV schéma/table/lignes) au count(*) de la base restaurée.
          # Sortie : « schéma.table<TAB>attendu<TAB>obtenu » (obtenu = -1 : table absente).
          verifier() {
            {
              printf 'create temp table attendu (s text, t text, n bigint);\ncopy attendu from stdin;\n'
              cat "$1"
              printf '%s\n' '\.'
              cat <<'SQL'
          select s || '.' || t, n,
                 case when to_regclass(format('%I.%I', s, t)) is null then -1
                      else (xpath('/row/n/text()', query_to_xml(format('select count(*) as n from %I.%I', s, t), false, true, '')))[1]::text::bigint
                 end
          from attendu
          order by 1;
          SQL
            } | psql_pile -At -F $'\t' -f -
          }

          # Affiche le résultat de verifier ($1) et échoue au moindre écart.
          comparer() {
            local ko=0 table attendu obtenu
            while IFS=$'\t' read -r table attendu obtenu; do
              if [ "$obtenu" = "-1" ]; then
                echo "::error::$table : table absente après restauration."
                ko=1
              elif [ "$attendu" != "$obtenu" ]; then
                echo "::error::$table : $attendu ligne(s) dans la sauvegarde, $obtenu après restauration."
                ko=1
              else
                printf '  %-48s %9s\n' "$table" "$obtenu"
              fi
            done < "$1"
            return "$ko"
          }
          OUTILS

      - name: Trouver la sauvegarde à restaurer
        env:
          RUN_DEMANDE: ${{ inputs.sauvegarde_run_id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "Sauvegarde préalable de cette exécution (PR) : exécution $GITHUB_RUN_ID."
            echo "SAUVEGARDE_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$RUN_DEMANDE" ]; then
            if ! [[ "$RUN_DEMANDE" =~ ^[0-9]+$ ]]; then echo "::error::Numéro d'exécution invalide."; exit 1; fi
            echo "Exécution demandée : $RUN_DEMANDE."
            echo "SAUVEGARDE_RUN_ID=$RUN_DEMANDE" >> "$GITHUB_ENV"
            exit 0
          fi
          ligne="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sauvegarde-base.yml --branch main \
                     --status success --limit 1 --json databaseId,createdAt \
                     --jq '.[] | "\(.databaseId) \(.createdAt)"')"
          if [ -z "$ligne" ]; then
            echo "::error::Aucune exécution réussie de « Sauvegarde de la base » sur main : rien à restaurer."
            exit 1
          fi
          read -r run_id lancee_le <<< "$ligne"
          age=$(( $(date -u +%s) - $(date -u -d "$lancee_le" +%s) ))
          echo "Dernière sauvegarde réussie : exécution $run_id, lancée le $lancee_le (il y a $(( age / 3600 )) h)."
          echo "SAUVEGARDE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          if [ "$age" -gt $(( 48 * 3600 )) ]; then
            echo "::warning::La dernière sauvegarde réussie a plus de 48 h. Le test continue sur celle-ci, puis échouera."
            echo "SAUVEGARDE_PERIMEE=1" >> "$GITHUB_ENV"
          fi

      - name: Télécharger l'artefact chiffré
        run: |
          source "$RUNNER_TEMP/outils.sh"
          mkdir -p "$R/artefact"
          gh run download "$SAUVEGARDE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name sauvegarde-base --dir "$R/artefact"
          shopt -s nullglob
          archives=("$R"/artefact/sauvegarde-*.tar.gz.gpg)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::L'artefact sauvegarde-base doit contenir une seule archive sauvegarde-*.tar.gz.gpg (trouvé : ${#archives[@]})."
            exit 1
          fi
          nom="$(basename "${archives[0]}")"
          if [[ "$nom" =~ ^sauvegarde-([0-9]{4})([0-9]{2})([0-9]{2})-([0-9]{2})([0-9]{2})\.tar\.gz\.gpg$ ]]; then
            date_sauvegarde="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]} ${BASH_REMATCH[4]}:${BASH_REMATCH[5]} UTC"
          else
            date_sauvegarde="$nom"
          fi
          echo "SAUVEGARDE_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"
          echo "SAUVEGARDE_NOM=$nom" >> "$GITHUB_ENV"
          echo "SAUVEGARDE_DATE=$date_sauvegarde" >> "$GITHUB_ENV"
          echo "Archive $nom ($(stat -c %s "${archives[0]}") octets) : sauvegarde du $date_sauvegarde."

      - name: Comparer avec la copie R2 (hors de GitHub)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'suivi-fuites-photos' }}
        run: |
          source outils/sauvegarde/commun.sh
          r2_config
          local_sha="$(sha256sum "$SAUVEGARDE_ARCHIVE" | cut -d' ' -f1)"
          if ! r2_sha="$(r2 s3 cp "s3://$R2_BUCKET/sauvegardes/base/$SAUVEGARDE_NOM" - --no-progress | sha256sum | cut -d' ' -f1)"; then
            echo "::error::Copie R2 introuvable : sauvegardes/base/$SAUVEGARDE_NOM."
            exit 1
          fi
          if [ "$local_sha" != "$r2_sha" ]; then
            echo "::error::La copie R2 diffère de l'artefact GitHub (empreintes SHA-256 différentes)."
            exit 1
          fi
          echo "Copie R2 identique à l'artefact GitHub (SHA-256)."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer une pile Supabase locale vierge
        run: |
          mkdir -p "$RUNNER_TEMP/pile-supabase"
          cd "$RUNNER_TEMP/pile-supabase"
          supabase --version
          supabase init
          supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > /dev/null
          docker ps --format '{{.Names}}  {{.Image}}'
          conteneur="$(docker ps --format '{{.Names}}' | grep '^supabase_db_')"
          echo "BASE_CONTENEUR=$conteneur" >> "$GITHUB_ENV"

      - name: Déchiffrer la sauvegarde
        env:
          SAUVEGARDE_PASSPHRASE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}
        run: |
          source "$RUNNER_TEMP/outils.sh"
          if [ -z "$SAUVEGARDE_PASSPHRASE" ]; then
            echo "::error::Secret SAUVEGARDE_PASSPHRASE manquant dans GitHub."
            exit 1
          fi
          bash outils/sauvegarde/restaurer.sh dechiffrer "$SAUVEGARDE_ARCHIVE" "$F"
          wc -c "$F"/*.sql
          echo "donnees.sql : blocs COPY par schéma"
          blocs_copy "$F/donnees.sql" | cut -f1 | sort | uniq -c

      - name: Restaurer schema.sql, donnees.sql puis complement.sql
        run: |
          source "$RUNNER_TEMP/outils.sh"
          RESTAURATION_PSQL="$(commande_psql)" bash outils/sauvegarde/restaurer.sh charger "$F"

      - name: Compter les lignes de chaque table
        run: |
          source "$RUNNER_TEMP/outils.sh"
          blocs_copy "$F/donnees.sql" > "$R/attendu.tsv"
          verifier "$R/attendu.tsv" > "$R/resultats.tsv"
          echo "Lignes par table (donnees.sql) :"
          comparer "$R/resultats.tsv"

      - name: Contrôles finaux
        run: |
          source "$RUNNER_TEMP/outils.sh"
          absentes="$(psql_pile -At -c "select string_agg(t, ', ') from unnest(array['public.marches', 'public.profils', 'public.affectations', 'public.zones', 'public.fuites', 'public.photos', 'public.reparations', 'public.prix', 'public.attachements', 'public.journal', 'auth.users', 'storage.buckets', 'storage.objects']) as t where to_regclass(t) is null")"
          if [ -n "$absentes" ]; then
            echo "::error::Tables clés absentes après restauration : $absentes"
            exit 1
          fi
          read -r marches comptes <<< "$(psql_pile -At -F ' ' -c 'select (select count(*) from public.marches), (select count(*) from auth.users)')"
          echo "Marchés : $marches ; comptes auth.users : $comptes"
          if [ "$marches" -lt 1 ]; then echo "::error::Aucun marché dans la base restaurée."; exit 1; fi
          if [ "$comptes" -lt 1 ]; then echo "::error::Aucun compte dans auth.users après restauration."; exit 1; fi
          # Le complément (déclencheur de auth.users, règles de storage.objects) doit être revenu en entier.
          attendus_decl="$(grep -c '^CREATE TRIGGER ' "$F/complement.sql" || true)"
          attendues_pol="$(grep -c '^create policy ' "$F/complement.sql" || true)"
          obtenus_decl="$(psql_pile -At -c "select count(*) from pg_trigger tg join pg_proc p on p.oid = tg.tgfoid join pg_namespace n on n.oid = p.pronamespace where tg.tgrelid = 'auth.users'::regclass and not tg.tgisinternal and n.nspname <> 'auth'")"
          obtenues_pol="$(psql_pile -At -c "select count(*) from pg_policies where schemaname = 'storage' and tablename in ('objects', 'buckets')")"
          echo "Déclencheurs applicatifs sur auth.users : $obtenus_decl (sauvegardés : $attendus_decl) ; règles de storage : $obtenues_pol (sauvegardées : $attendues_pol)"
          if [ "$attendus_decl" -lt 1 ] || [ "$obtenus_decl" != "$attendus_decl" ]; then
            echo "::error::Le déclencheur de création de profil (creer_profil_apres_inscription) manque dans la sauvegarde ou après restauration."
            exit 1
          fi
          if [ "$attendues_pol" -lt 1 ] || [ "$obtenues_pol" != "$attendues_pol" ]; then
            echo "::error::Les règles de storage.objects (photos, evenements, logos) manquent dans la sauvegarde ou après restauration."
            exit 1
          fi
          nouveau="$(psql_pile -At -c "select count(*) from pg_trigger where tgrelid = 'auth.users'::regclass and tgname = 'creer_profil_apres_inscription'")"
          if [ "$nouveau" != "1" ]; then
            echo "::error::creer_profil_apres_inscription absent de auth.users après restauration."
            exit 1
          fi

      - name: Résumé
        run: |
          source "$RUNNER_TEMP/outils.sh"
          {
            echo "## Test de restauration"
            echo
            echo "Sauvegarde du $SAUVEGARDE_DATE (copie R2 identique, déclencheur et règles de storage restaurés)"
            echo
            echo "| Table | Lignes |"
            echo "| --- | ---: |"
            while IFS=$'\t' read -r table _ obtenu; do echo "| $table | $obtenu |"; done < "$R/resultats.tsv"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Signaler une sauvegarde trop ancienne
        if: env.SAUVEGARDE_PERIMEE == '1'
        run: |
          echo "::error::La dernière sauvegarde réussie a plus de 48 h : la sauvegarde nocturne semble arrêtée (voir Actions > Sauvegarde de la base)."
          exit 1

      - name: Effacer les fichiers déchiffrés et arrêter la pile
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/restauration" "$RUNNER_TEMP/outils.sh"
          gpgconf --kill gpg-agent 2> /dev/null || true
          if command -v supabase > /dev/null && [ -d "$RUNNER_TEMP/pile-supabase/supabase" ]; then
            (cd "$RUNNER_TEMP/pile-supabase" && supabase stop --no-backup) || true
          fi
