# Configuration minimale de la CLI Supabase (valeurs par défaut pour le reste).
# Le projet distant est désigné par sa référence dans le workflow de déploiement.
project_id = "suivi-fuites"

[db]
major_version = 17

[functions.gerer-utilisateurs]
verify_jwt = true

[functions.photos-r2]
verify_jwt = true

# Appelée par la base (pg_net, pg_cron) avec sa clé d'appel, sans JWT : elle la fait vérifier par la base.
[functions.envoyer-push]
verify_jwt = false

[functions.version-apk]
verify_jwt = true

[functions.reseau-tuiles]
verify_jwt = true

# Appelée par la tâche planifiée du serveur Dolibarr, sans compte : elle vérifie elle-même le jeton dédié (DOLIBARR_JETON).
[functions.dolibarr-mouvements]
verify_jwt = false
