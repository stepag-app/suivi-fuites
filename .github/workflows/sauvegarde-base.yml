name: Sauvegarde de la base

# Le plan gratuit de Supabase n'a aucune sauvegarde : ce workflow exporte chaque nuit le schéma, les
# données (comptes et enregistrements de fichiers compris) et le complément applicatif de auth et
# storage (déclencheur de création de profil, règles des fichiers), chiffre le tout (AES-256) puis :
#  1. le garde 7 jours en artefact GitHub (dépôt privé ; rétention courte, les copies durables sont R2 et le Drive) ;
#  2. en dépose une copie HORS de GitHub dans Cloudflare R2 (compartiment SÉPARÉ suivi-fuites-sauvegardes,
#     préfixe sauvegardes/base/), vérifiée par empreinte SHA-256, 30 jours de conservation (les archives plus
#     anciennes sont supprimées par le workflow, au moins 7 récentes toujours gardées) ;
#  3. copie dans ce compartiment (préfixe sauvegardes/stockage-supabase/) les fichiers encore dans Supabase Storage ;
#  4. second job « drive » : copie COMPLÈTE hors de Supabase, Vercel, R2 et GitHub, sur le Google Drive du
#     compte stepag.app@gmail.com (rclone) : archive de la base (30 quotidiennes, 12 mensuelles), photos et
#     APK du compartiment R2, fichiers de Supabase Storage. Incrémentale ; rien n'est jamais effacé du Drive,
#     sauf la rotation des archives de base. Échec visible : étape en échec et résumé de l'exécution.
# À la demande : Actions > Sauvegarde de la base > Run workflow. Appelé aussi par « Purge (mise en service) »
# juste avant une purge (workflow_call).
# Scripts : outils/sauvegarde/ (exporter.sh, copie-r2.sh, photos-vers-r2.sh, copie-drive.sh, isolement-r2.sh). Procédure de
# restauration : supabase/README.md, sections « Sauvegarde et restauration » et « Reprise après sinistre ».
# Secrets (Settings > Secrets and variables > Actions) :
#  * SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD : déjà créés pour le déploiement
#  * SAUVEGARDE_PASSPHRASE : phrase secrète de chiffrement. À ranger dans le gestionnaire de mots de
#    passe : sans elle, les sauvegardes sont illisibles. Jamais dans le dépôt ni dans une conversation.
#    Elle n'est jamais envoyée dans R2 : seule l'archive chiffrée y va.
#  * R2_ACCOUNT_ID et, dans l'environnement sauvegarde-production (H10) :
#    - R2_SAUV_ACCESS_KEY_ID, R2_SAUV_SECRET_ACCESS_KEY : jeton Object Read & Write limité au SEUL compartiment
#      suivi-fuites-sauvegardes (variable facultative R2_BUCKET_SAUVEGARDES). Il n'est jamais donné aux
#      fonctions Supabase : une clé des photos qui fuit ne peut ni lire ni effacer les sauvegardes ;
#    - R2_RO_ACCESS_KEY_ID, R2_RO_SECRET_ACCESS_KEY : jeton Object Read only du compartiment des photos (le même
#      que dans base-production), pour la copie des photos et des APK sur le Drive ;
#    - repli (avant la mise en service) : R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, jeton Object Read & Write du
#      compartiment des photos (variable facultative R2_BUCKET), utilisé quand l'un des deux jetons manque.
#    Choix de la clé : r2_cle dans outils/sauvegarde/commun.sh.
#  * SAUVEGARDE_DRIVE_CONFIG : section [drive] de la configuration rclone (autorisation du Drive de
#    stepag.app, créée par Issam : note pas à pas « Autoriser rclone sur le Drive »). Sans ce secret, le job
#    drive échoue.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SUPABASE_PROJECT_ID: osajiinsibwrsltntmsk

jobs:
  sauvegarde:
    name: Exporter, chiffrer et copier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Environnement protégé « sauvegarde-production » (Settings > Environments, branches autorisées = main,
    # SANS relecteur obligatoire : la sauvegarde tourne en automatique chaque nuit) (H6).
    environment: sauvegarde-production
    concurrency:
      group: sauvegarde-r2
      cancel-in-progress: false
    # Le job drive copie l'archive dès qu'elle est en artefact, même si une étape R2 qui suit échoue.
    outputs:
      archive: ${{ steps.artefact.outcome }}
      r2: ${{ steps.copie_r2.outcome }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SAUVEGARDE_PASSPHRASE: ${{ secrets.SAUVEGARDE_PASSPHRASE }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_SAUV_ACCESS_KEY_ID: ${{ secrets.R2_SAUV_ACCESS_KEY_ID }}
      R2_SAUV_SECRET_ACCESS_KEY: ${{ secrets.R2_SAUV_SECRET_ACCESS_KEY }}
      R2_BUCKET_SAUVEGARDES: ${{ vars.R2_BUCKET_SAUVEGARDES || 'suivi-fuites-sauvegardes' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'suivi-fuites-photos' }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des secrets
        # Les clés R2 ne sont pas exigées ici : mal posées, elles font échouer les seules étapes R2, après l'artefact,
        # et l'archive part quand même sur le Drive.
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SAUVEGARDE_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v manquant dans GitHub."; exit 1; fi
          done
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Lier le projet
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Exporter
        run: bash outils/sauvegarde/exporter.sh sauvegarde
      - name: Archiver et chiffrer (AES-256)
        run: |
          tar -czf - -C sauvegarde . \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase "$SAUVEGARDE_PASSPHRASE" -o "sauvegarde-$(date -u +%Y%m%d-%H%M).tar.gz.gpg"
          rm -rf sauvegarde
          ls -l sauvegarde-*.gpg
      - uses: actions/upload-artifact@v4
        id: artefact
        with:
          name: sauvegarde-base
          # Rétention courte (H6) : l'archive chiffrée reste 30 j dans R2 et sans limite sur le Drive ;
          # l'artefact GitHub ne sert qu'à la copie Drive du même run et au test de restauration (< 48 h).
          retention-days: 7
          path: sauvegarde-*.tar.gz.gpg
          if-no-files-found: error
      - name: Copie hors de GitHub (R2, 30 jours)
        id: copie_r2
        run: bash outils/sauvegarde/copie-r2.sh sauvegarde-*.tar.gz.gpg
      - name: Fichiers de Supabase Storage vers R2
        run: bash outils/sauvegarde/photos-vers-r2.sh

  drive:
    name: Copie sur le Drive (hors plateformes)
    needs: sauvegarde
    # Même si l'export de la base a échoué : les photos et les APK sont copiées quand même.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Même environnement protégé que « sauvegarde » (branches = main, sans relecteur) (H6).
    environment: sauvegarde-production
    concurrency:
      group: sauvegarde-drive
      cancel-in-progress: false
    env:
      SAUVEGARDE_DRIVE_CONFIG: ${{ secrets.SAUVEGARDE_DRIVE_CONFIG }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_RO_ACCESS_KEY_ID: ${{ secrets.R2_RO_ACCESS_KEY_ID }}
      R2_RO_SECRET_ACCESS_KEY: ${{ secrets.R2_RO_SECRET_ACCESS_KEY }}
      R2_SAUV_ACCESS_KEY_ID: ${{ secrets.R2_SAUV_ACCESS_KEY_ID }}
      R2_SAUV_SECRET_ACCESS_KEY: ${{ secrets.R2_SAUV_SECRET_ACCESS_KEY }}
      R2_BUCKET_SAUVEGARDES: ${{ vars.R2_BUCKET_SAUVEGARDES || 'suivi-fuites-sauvegardes' }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'suivi-fuites-photos' }}
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la configuration du Drive
        id: config
        # Seul le Drive est exigé ici : une clé R2 manquante fait échouer les seules étapes R2 (photos, Storage),
        # l'archive de la base part quand même.
        run: |
          if [ -z "$SAUVEGARDE_DRIVE_CONFIG" ]; then
            echo "::error::Secret SAUVEGARDE_DRIVE_CONFIG manquant dans GitHub : la copie hors plateformes sur le Drive n'est pas configurée (note pas à pas « Autoriser rclone sur le Drive »)."
            exit 1
          fi
          echo "configure=oui" >> "$GITHUB_OUTPUT"
      - name: Installer rclone (version épinglée)
        if: steps.config.outputs.configure == 'oui'
        run: bash outils/sauvegarde/installer-rclone.sh
      - name: Connexion au Drive
        id: connexion
        if: steps.config.outputs.configure == 'oui'
        run: |
          echo "RCLONE_CONFIG=$RUNNER_TEMP/rclone.conf" >> "$GITHUB_ENV"
          RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf" bash outils/sauvegarde/copie-drive.sh preparer
      - name: Récupérer l'archive chiffrée de ce job
        id: recuperer
        if: ${{ !cancelled() && steps.connexion.outcome == 'success' && needs.sauvegarde.outputs.archive == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: sauvegarde-base
          path: archive
      - name: Archive de la base vers le Drive (vérifiée, rotation)
        id: base
        if: ${{ !cancelled() && steps.recuperer.outcome == 'success' }}
        run: |
          shopt -s nullglob
          archives=(archive/sauvegarde-*.tar.gz.gpg)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::L'artefact sauvegarde-base doit contenir une seule archive (trouvé : ${#archives[@]})."
            exit 1
          fi
          bash outils/sauvegarde/copie-drive.sh base "${archives[0]}"
      - name: Photos et APK (R2) vers le Drive
        id: r2
        if: ${{ !cancelled() && steps.connexion.outcome == 'success' }}
        run: bash outils/sauvegarde/copie-drive.sh r2
      - name: Fichiers de Supabase Storage vers le Drive
        id: stockage
        if: ${{ !cancelled() && steps.connexion.outcome == 'success' }}
        run: bash outils/sauvegarde/copie-drive.sh stockage
      - name: Isolement des clés R2 (H10)
        id: isolement
        if: ${{ !cancelled() }}
        run: bash outils/sauvegarde/isolement-r2.sh
      - name: Espace du Drive et LISEZMOI
        id: espace
        if: ${{ !cancelled() && steps.connexion.outcome == 'success' }}
        run: |
          bash outils/sauvegarde/copie-drive.sh lisezmoi
          bash outils/sauvegarde/copie-drive.sh espace | tee "$RUNNER_TEMP/espace.txt"
      - name: Résumé
        if: always()
        env:
          CONFIG: ${{ steps.config.outcome }}
          CONNEXION: ${{ steps.connexion.outcome }}
          ARCHIVE: ${{ needs.sauvegarde.outputs.archive }}
          COPIE_R2: ${{ needs.sauvegarde.outputs.r2 }}
          RECUPERER: ${{ steps.recuperer.outcome }}
          BASE: ${{ steps.base.outcome }}
          R2: ${{ steps.r2.outcome }}
          STOCKAGE: ${{ steps.stockage.outcome }}
          ISOLEMENT: ${{ steps.isolement.outcome }}
        run: |
          etat() {
            case "$1" in
              success) echo "✅ réussi" ;;
              failure) echo "❌ **ÉCHEC**" ;;
              skipped) echo "⏭️ non exécuté" ;;
              cancelled) echo "⚠️ annulé" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Copie hors plateformes (Google Drive stepag.app)"
            echo
            if [ "$CONFIG" = "failure" ]; then
              echo "❌ **Drive non configuré** : secret \`SAUVEGARDE_DRIVE_CONFIG\` manquant. Aucune copie n'a été faite."
            else
              echo "| Élément | État |"
              echo "| --- | --- |"
              echo "| Connexion au Drive | $(etat "$CONNEXION") |"
              echo "| Archive exportée et chiffrée (job précédent) | $(etat "${ARCHIVE:-skipped}") |"
              echo "| Copie R2 des sauvegardes (job précédent) | $(etat "${COPIE_R2:-skipped}") |"
              if [ "$RECUPERER" = failure ]; then BASE=failure; fi
              echo "| Archive chiffrée de la base sur le Drive (SHA-256 relu, rotation) | $(etat "$BASE") |"
              echo "| Photos et APK du compartiment R2 | $(etat "$R2") |"
              echo "| Fichiers de Supabase Storage | $(etat "$STOCKAGE") |"
              echo "| Isolement des clés R2 (H10) | $(etat "$ISOLEMENT") |"
              if [ -s "$RUNNER_TEMP/espace.txt" ]; then echo; grep -v '^::' "$RUNNER_TEMP/espace.txt" || true; fi
              echo
              echo "Rien n'est supprimé du Drive, sauf la rotation des archives de base (30 quotidiennes, 12 mensuelles)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Effacer la configuration rclone
        if: always()
        run: rm -f "$RUNNER_TEMP/rclone.conf" "$RUNNER_TEMP/espace.txt"
